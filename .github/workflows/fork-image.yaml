# Builds the topolvm-with-sidecar image of this branch for linux/amd64 with
# upstream's Dockerfile and bake target, and pushes it to this repository
# owner's GitHub Container Registry namespace.
#
# Trigger with a tag named image-<version>, for example image-0.42.1-fast.1,
# which publishes ghcr.io/<owner>/topolvm-with-sidecar:0.42.1-fast.1. The tag
# deliberately does not start with "v": upstream's release workflow runs on
# tags matching v*.
name: "Fork image"

on:
  push:
    tags:
      - "image-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag and TOPOLVM_VERSION, e.g. 0.42.1-fast.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    name: "build and push topolvm-with-sidecar (linux/amd64)"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Resolve version"
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "${REF_TYPE}" = "tag" ]; then
            VERSION="${REF_NAME#image-}"
          else
            VERSION="${INPUT_VERSION}"
          fi
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.]+$'; then
            echo "::error::version must look like 0.42.1-fast.1, got '${VERSION}'"
            exit 1
          fi
          OWNER=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "prefix=ghcr.io/${OWNER}/" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login registry
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          IMAGE_PREFIX: ${{ steps.version.outputs.prefix }}
          IMAGE_TAG: ${{ steps.version.outputs.version }}
          TOPOLVM_VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx bake --no-cache --push \
            --set 'topolvm-with-sidecar.platform=linux/amd64' \
            --metadata-file /tmp/bake-metadata.json \
            topolvm-with-sidecar
      - name: Report digest
        env:
          IMAGE_PREFIX: ${{ steps.version.outputs.prefix }}
          IMAGE_TAG: ${{ steps.version.outputs.version }}
        run: |
          DIGEST=$(jq -r '."topolvm-with-sidecar"."containerimage.digest"' /tmp/bake-metadata.json)
          REF="${IMAGE_PREFIX}topolvm-with-sidecar:${IMAGE_TAG}@${DIGEST}"
          echo "image: ${REF}"
          {
            echo "### Image"
            echo
            echo "\`${REF}\`"
            echo
            echo "Built from \`${GITHUB_SHA}\`."
          } >> "${GITHUB_STEP_SUMMARY}"
